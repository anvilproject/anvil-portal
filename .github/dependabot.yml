version: 2
updates:
  # GitHub Actions used by the repo's workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    assignees:
      - "NoopDog"
  # npm dependencies in the root `package.json`
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    assignees:
      - "NoopDog"
  # Python dependencies of the analytics scripts
  - package-ecosystem: "pip"
    directory: "/analytics"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    assignees:
      - "NoopDog"
  # Python dependencies of the disease-codes scripts
  - package-ecosystem: "pip"
    directory: "/scripts/disease-codes"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    assignees:
      - "NoopDog"
